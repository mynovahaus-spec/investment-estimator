<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wedding Stationery Investment Estimator</title>

  <style>
    :root {
      --nova-blue: #9db2c4;
      --nova-blue-dark: #8fa6b9;
      --nova-sage: #d8ddbf;
      --nova-sage-dark: #c8d0b6;
      --nova-cream: #fbfaf7;
      --nova-white: #ffffff;
      --nova-text: #6f7472;
      --nova-border: #dfe3d7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--nova-cream);
      font-family: Arial, sans-serif;
      color: var(--nova-text);
    }

    .calculator {
      max-width: 760px;
      margin: 50px auto;
      padding: 40px 24px;
    }

    h1 {
      font-family: Georgia, serif;
      font-weight: 400;
      font-size: 38px;
      text-align: center;
      margin-bottom: 12px;
      color: var(--nova-sage-dark);
    }

    .intro {
      text-align: center;
      line-height: 1.6;
      color: #666;
      max-width: 620px;
      margin: 0 auto 45px;
    }

    .section {
      margin-bottom: 40px;
    }

    .section h2 {
      font-family: Georgia, serif;
      font-weight: 400;
      font-size: 24px;
      margin-bottom: 8px;
      color: var(--nova-blue);
    }

    .section-note {
      color: #777;
      font-size: 14px;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .option {
      position: relative;
    }

    .option input {
      position: absolute;
      opacity: 0;
    }

    .option label {
      display: block;
      height: 100%;
      padding: 16px;
      text-align: center;
      background: var(--nova-white);
      border: 1px solid var(--nova-border);
      cursor: pointer;
      transition: 0.2s;
    }

    .option label:hover {
      border-color: var(--nova-blue);
    }

    .option input:focus-visible + label {
      outline: 2px solid var(--nova-blue);
      outline-offset: 2px;
    }

    .option input:checked + label {
      background: var(--nova-blue);
      color: var(--nova-white);
      border-color: var(--nova-blue);
    }

    .package-details {
      margin-top: 18px;
      padding: 22px;
      background: var(--nova-white);
      border: 1px solid var(--nova-border);
      color: var(--nova-text);
      font-size: 14px;
      line-height: 1.65;
    }

    .package-details strong {
      color: var(--nova-blue);
    }

    .package-details ul {
      margin: 10px 0 0;
      padding-left: 20px;
    }

    .subheading {
      display: block;
      margin-top: 16px;
      margin-bottom: 4px;
      font-weight: 700;
      color: var(--nova-text);
    }

    .estimate-box {
      background: var(--nova-white);
      border: 1px solid var(--nova-border);
      padding: 35px 20px;
      text-align: center;
      margin-top: 50px;
    }

    .estimate-label {
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-size: 12px;
      color: #777;
      margin-bottom: 10px;
    }

    #estimate {
      font-family: Georgia, serif;
      font-size: 40px;
      margin-bottom: 14px;
      color: var(--nova-blue);
    }

    .estimate-note {
      color: #777;
      font-size: 13px;
      line-height: 1.6;
      max-width: 560px;
      margin: 0 auto;
    }

    .button {
      display: inline-block;
      margin-top: 24px;
      background: var(--nova-blue);
      color: var(--nova-white);
      text-decoration: none;
      padding: 15px 28px;
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 2px;
    }

    .button:hover {
      background: var(--nova-blue-dark);
    }

    @media (max-width: 650px) {
      .options {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 30px;
      }

      #estimate {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

  <!-- STEP 2 -->

    <div

      id="package-details"
      aria-live="polite"
    ></div>

  </div>

  <!-- STEP 3 -->

  <div class="section">

    <h2>3. How many do you need?</h2>

    <p
      class="section-note"
      id="quantity-note"
    ></p>

    <div
      class="options"
      id="quantity-options"
    ></div>

  </div>

  <!-- ESTIMATE -->

  <div class="estimate-box">

    <div class="estimate-label">
      Estimated Investment
    </div>

    <div id="estimate">
      $2,250
    </div>

    <p

    <a
      class="button"
      href="https://www.novahausstationery.com/general-inquiry-form"
      target="_top"
    >
      Start Your Project

  </div>

</div>

/* =====================================================
   CALCULATOR FUNCTIONALITY
===================================================== */

const packageOptions =
  document.getElementById("package-options");

const packageDetails =
  document.getElementById("package-details");

const quantityOptions =
  document.getElementById("quantity-options");

const estimate =
  document.getElementById("estimate");

const estimateNote =
  document.getElementById("estimate-note");

const quantityNote =
  document.getElementById("quantity-note");


function selectedCollection() {

  return document
    .querySelector('input[name="collection"]:checked')
    .value;

}


function selectedPackage() {

  return document
    .querySelector('input[name="package"]:checked')
    ?.value || "essential";

}


function renderPackages() {

  const collection =
    selectedCollection();

  packageOptions.innerHTML =
    Object.entries(packages[collection])

      .map(([key, value], index) => `

        <div class="option">

          <input
            type="radio"
            name="package"
            id="p-${key}"
            value="${key}"
            ${index === 0 ? "checked" : ""}
          >

          <label for="p-${key}">
            ${value.name}
          </label>

        </div>

      `)

      .join("");


  packageOptions
    .querySelectorAll('input[name="package"]')

    .forEach(input => {

      input.addEventListener(
        "change",
        renderQuantities
      );

    });


  renderQuantities();

}


function renderQuantities() {

  const collection =
    selectedCollection();

  const selected =
    packages[collection][selectedPackage()];

  const quantities =
    selected.pricing;


  packageDetails.innerHTML =
    selected.copy;

  estimateNote.innerText =
    selected.note;


  if (collection === "invitations") {

    quantityNote.innerText =
      "Invitation quantities should be based on households rather than total guest count. I recommend ordering a few extras for keepsakes, photography, and last-minute additions.";

  } else {

    quantityNote.innerText =
      "Save the Date quantities should be based on households rather than total guest count. I recommend ordering a few extras for keepsakes, photography, and last-minute additions.";

  }


  const preferredQuantity =
    quantities[100]
      ? 100
      : Number(Object.keys(quantities)[0]);


  quantityOptions.innerHTML =
    Object.entries(quantities)

      .map(([quantity, price]) => `

        <div class="option">

          <input
            type="radio"
            name="quantity"
            id="q${quantity}"
            value="${price}"
            ${Number(quantity) === preferredQuantity ? "checked" : ""}
          >

          <label for="q${quantity}">

            ${quantity}
            ${collection === "invitations"
              ? "Suites"
              : "Save the Dates"}

          </label>

        </div>

      `)

      .join("");


  quantityOptions
    .querySelectorAll('input[name="quantity"]')

    .forEach(input => {

      input.addEventListener(
        "change",
        calculateEstimate
      );

    });


  calculateEstimate();

}


function calculateEstimate() {

  const total =
    Number(
      document
        .querySelector('input[name="quantity"]:checked')
        ?.value || 0
    );


  estimate.innerText =
    `$${total.toLocaleString()}`;

}


document
  .querySelectorAll('input[name="collection"]')

  .forEach(input => {

    input.addEventListener(
      "change",
      renderPackages
    );

  });


renderPackages();
